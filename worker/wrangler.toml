name = "toova-og-gateway"
main = "src/index.ts"
compatibility_date = "2026-08-19"
workers_dev = false

[[routes]]
pattern = "toova.net/r/*"
zone_name = "toova.net"

[[routes]]
pattern = "toova.net/u/*"
zone_name = "toova.net"

[[routes]]
pattern = "toova.net/og/*"
zone_name = "toova.net"

[[routes]]
pattern = "www.toova.net/r/*"
zone_name = "toova.net"

[[routes]]
pattern = "www.toova.net/u/*"
zone_name = "toova.net"

[[routes]]
pattern = "www.toova.net/og/*"
zone_name = "toova.net"

