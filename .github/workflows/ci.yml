name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:billing
      - run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_TRELLIS_GENERATE_URL: ${{ vars.VITE_TRELLIS_GENERATE_URL || secrets.VITE_TRELLIS_GENERATE_URL }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || 'G-WS2JEV7YRE' }}

  db-tests:
    runs-on: ubuntu-latest
    env:
      # Prefer GitHub Container Registry mirrors (ECR rate-limits shared CI runners).
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: |
          # Public ECR pulls occasionally hit rate limits on GitHub-hosted runners.
          for attempt in 1 2 3 4 5 6 7 8; do
            if supabase start; then exit 0; fi
            echo "supabase start failed (attempt ${attempt}), retrying in 30s…"
            sleep 30
          done
          exit 1
      - name: Run database tests
        run: npm run test:db
